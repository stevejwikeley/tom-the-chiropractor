<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social banners — Tom the Chiropractor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--color-tan);
    color:var(--color-ink);
    font:var(--type-body);
  }
  .page{
    max-width:1100px;
    margin:0 auto;
    padding:var(--space-section-y) var(--space-section-x) 96px;
  }
  h1{
    font:var(--type-h2);
    margin:0 0 4px;
  }
  .lede{
    color:var(--ink-99);
    margin:0 0 32px;
    max-width:640px;
  }
  .tool{
    background:var(--color-cream);
    border:1px solid var(--ink-1a);
  }
  .canvas-wrap{
    padding:24px;
    border-bottom:1px solid var(--ink-1a);
    overflow-x:auto;
  }
  canvas{
    display:block;
    width:100%;
    height:auto;
    max-width:1584px;
  }
  .format-label{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin-bottom:12px;
  }
  .format-label strong{
    font:var(--type-h3);
  }
  .format-label span{
    font:var(--type-body-sm);
    color:var(--ink-99);
  }
  .controls{
    padding:24px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px 24px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field--wide{
    grid-column:1 / -1;
  }
  label{
    font:var(--type-body-sm);
    font-weight:500;
    color:var(--ink-b3);
  }
  input[type="text"], input[type="number"], select{
    font:var(--type-body);
    padding:10px 12px;
    border:1px solid var(--ink-1a);
    background:#fff;
    color:var(--color-ink);
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus{
    outline:2px solid var(--color-teal);
    outline-offset:-1px;
  }
  .dims-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .dims-row input{
    width:90px;
  }
  .dims-row span{
    color:var(--ink-99);
  }
  .preset-select{
    margin-top:8px;
    font-size:13px;
  }
  .style-toggle{
    display:flex;
    border:1px solid var(--ink-1a);
    width:fit-content;
  }
  .style-toggle button{
    font:var(--type-button);
    text-transform:uppercase;
    letter-spacing:.02em;
    padding:10px 18px;
    border:none;
    background:#fff;
    color:var(--ink-b3);
    cursor:pointer;
  }
  .style-toggle button + button{
    border-left:1px solid var(--ink-1a);
  }
  .style-toggle button[aria-pressed="true"]{
    background:var(--color-ink);
    color:var(--color-cream);
  }
  .checkbox-row{
    flex-direction:row;
    align-items:center;
    gap:8px;
  }
  .checkbox-row input{
    width:16px;
    height:16px;
  }
  .checkbox-row label{
    color:var(--color-ink);
  }
  .actions{
    padding:20px 24px;
    border-top:1px solid var(--ink-1a);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .hint{
    font:var(--type-body-sm);
    color:var(--ink-99);
  }
  .btn{
    font:var(--type-button);
    text-transform:uppercase;
    letter-spacing:.02em;
    padding:13px 22px;
    border:none;
    cursor:pointer;
    background:var(--color-yellow);
    color:var(--color-ink);
  }
  .btn:hover{
    background:#d9b806;
  }
</style>
</head>
<body>
<div class="page">
  <h1>Social banners</h1>
  <p class="lede">Generates on-brand cover images at each platform's exact pixel size. Edit the text, then download — nothing here is served on the live site (excluded from the Vercel deploy, same as the rest of <code>design/</code>).</p>

  <div class="tool">
    <div class="canvas-wrap">
      <div class="format-label">
        <strong>Banner</strong>
        <span id="formatSize">1584 × 396 px</span>
      </div>
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
      <div class="field">
        <label for="widthInput">Dimensions (px)</label>
        <div class="dims-row">
          <input type="number" id="widthInput" value="1584" min="200" max="4000">
          <span>×</span>
          <input type="number" id="heightInput" value="396" min="50" max="4000">
        </div>
        <select id="presetSize" class="preset-select">
          <optgroup label="Social covers">
            <option value="1584,396" selected>LinkedIn personal cover — 1584×396</option>
            <option value="1128,191">LinkedIn company page cover — 1128×191</option>
            <option value="820,312">Facebook page cover — 820×312</option>
            <option value="1500,500">X (Twitter) header — 1500×500</option>
            <option value="1546,423">YouTube channel banner (safe area) — 1546×423</option>
          </optgroup>
          <optgroup label="Link previews">
            <option value="1200,630">Open Graph / link preview (Facebook, X, Slack, iMessage) — 1200×630</option>
          </optgroup>
          <optgroup label="Google Display ads">
            <option value="300,250">Medium rectangle — 300×250</option>
            <option value="728,90">Leaderboard — 728×90</option>
          </optgroup>
          <optgroup label="Forms">
            <option value="1680,1050">Typeform cover — 1680×1050</option>
          </optgroup>
        </select>
      </div>
      <div class="field">
        <label id="styleLabel">Style</label>
        <div class="style-toggle" role="group" aria-labelledby="styleLabel">
          <button type="button" data-style="typography" aria-pressed="true">Typography</button>
          <button type="button" data-style="photography" aria-pressed="false">Photography</button>
          <button type="button" data-style="yellow" aria-pressed="false">Yellow</button>
          <button type="button" data-style="social" aria-pressed="false">OG Image</button>
        </div>
      </div>

      <div class="field">
        <label for="actionPhoto">Photography image</label>
        <select id="actionPhoto"></select>
      </div>
      <div class="field checkbox-row" style="align-self:end;">
        <input type="checkbox" id="invert">
        <label for="invert">Invert colours (dark background)</label>
      </div>
      <div class="field checkbox-row" style="align-self:end;">
        <input type="checkbox" id="ogLinkedinGap">
        <label for="ogLinkedinGap">Use LinkedIn avatar-safe left margin</label>
      </div>

      <div class="field field--wide checkbox-row">
        <input type="checkbox" id="safeZone">
        <label for="safeZone">Show profile-photo safe zone (guide only, not exported)</label>
      </div>

      <div class="field field--wide">
        <label for="eyebrow">Eyebrow</label>
        <input type="text" id="eyebrow" value="TOM THE CHIROPRACTOR">
      </div>
      <div class="field field--wide">
        <label for="headline">Headline</label>
        <input type="text" id="headline" value="Neck, back or joint pain that won't shift?">
      </div>
      <div class="field field--wide">
        <label for="subtext">Subtext</label>
        <input type="text" id="subtext" value="Evening &amp; Saturday appointments. Get help from a local chiropractor.">
      </div>
      <div class="field field--wide">
        <label for="footer">Footer / website</label>
        <input type="text" id="footer" value="Appointments around your working day · tomthechiropractor.co.uk">
      </div>
    </div>

    <div class="actions">
      <span class="hint">Downloads a PNG at the exact size shown above.</span>
      <button class="btn" id="download">Download PNG</button>
    </div>
  </div>
</div>

<script>
// LinkedIn overlaps the profile photo on the bottom-left corner of the
// cover image; keep primary content clear of this box. Calibrated for the
// default 1584×396 LinkedIn size — still shown as a guide at other sizes.
const SAFE_ZONE = { x: 0, y: 0, w: 300, h: 300 };

// The site's full image library, so any shot can be picked for the
// Photography style rather than hardcoding one — cover-fit and cropped to
// a horizontal band.
const ACTION_DIR = '../images/action/';
const ACTION_PHOTOS = [
  'back/back-adjustment-with-instrument.jpg','back/lower-back-adjustment-face-down.jpg','back/lower-back-adjustment.jpg','back/mid-back-both-hands.jpg','back/mid-back-treatment.jpg','back/spine-examination.jpg','back/spine-forward-bend-assessment.jpg','back/upper-back-adjustment.jpg',
  'neck/neck-adjustment.jpg','neck/neck-and-shoulder-massager.jpg','neck/neck-muscle-check.jpg','neck/neck-rotation-assessment.jpg','neck/neck-treatment-lying-down.jpg','neck/neck-turn-check.jpg',
  'shoulder/shoulder-arm-to-side-test.jpg','shoulder/shoulder-cross-body-test.jpg','shoulder/shoulder-examination.jpg','shoulder/shoulder-posture-check.jpg','shoulder/shoulder-range-of-motion.jpg','shoulder/shoulders-and-upper-back-check.jpg',
  'nerve/arm-reflex-test-close-up.jpg','nerve/elbow-reflex-test.jpg',
  'joints/hand-and-wrist-check.jpg',
  'room/treatment-room-posture-check.jpg',
  '1Z5A8646.jpg','1Z5A8648.jpg','1Z5A8650.jpg','1Z5A8688.jpg','1Z5A8694.jpg','1Z5A8703.jpg','1Z5A8725.jpg','1Z5A8745.jpg','1Z5A8817.jpg','1Z5A8854.jpg','1Z5A8884.jpg','1Z5A8897.jpg','1Z5A8919.jpg','1Z5A8928.jpg','1Z5A8932.jpg','1Z5A8941.jpg','1Z5A8952.jpg','1Z5A8978.jpg','1Z5A9031.jpg','1Z5A9040.jpg','1Z5A9044.jpg','1Z5A9051.jpg','1Z5A9065.jpg','1Z5A9078.jpg','1Z5A9094.jpg','1Z5A9112.jpg','1Z5A9142.jpg','1Z5A9164.jpg','1Z5A9469.jpg'
];
const DEFAULT_ACTION_PHOTO = 'back/spine-forward-bend-assessment.jpg';

// For the OG Image style — a proper cutout (real alpha transparency, no
// baked-in backdrop) so it sits over the yellow fill with no colour-match
// seam to worry about, unlike the yellow-backdrop photos used elsewhere.
const OG_PORTRAIT_SRC = '../images/headshots/1Z5A8513-cutout.png';

const INK = '#00262A';
const CREAM = '#EFEADF';
const TEAL = '#00A6A6';
const YELLOW = '#EFCA07';

// Typography/Photography's text colours — "dark" is the ink-background
// default, "light" is what the invert checkbox switches to.
const SCHEMES = {
  dark: { eyebrow: YELLOW, headline: CREAM, subtext: TEAL, footer: 'rgba(239,234,223,0.55)' },
  light: { eyebrow: TEAL, headline: INK, subtext: 'rgba(0,38,42,0.7)', footer: 'rgba(0,38,42,0.5)' }
};

// Yellow style — matches Tom's print ads (postcard/business card): a flat
// colour field and a heavy display headline. The invert checkbox swaps it
// to the business card's dark-background treatment.
const AD_SCHEMES = {
  normal: { bg: YELLOW, eyebrow: INK, headline: INK, subtext: 'rgba(0,38,42,0.78)', footer: 'rgba(0,38,42,0.55)' },
  inverted: { bg: INK, eyebrow: YELLOW, headline: CREAM, subtext: 'rgba(239,234,223,0.78)', footer: 'rgba(239,234,223,0.55)' }
};

// OG Image style — the flat-field half of AD_SCHEMES, reused for the
// eyebrow/headline-only top-left layout.
const OG_SCHEMES = {
  normal: { bg: YELLOW, eyebrow: INK, headline: INK, subtext: 'rgba(0,38,42,0.7)', footer: 'rgba(0,38,42,0.5)' },
  inverted: { bg: INK, eyebrow: YELLOW, headline: CREAM, subtext: 'rgba(239,234,223,0.7)', footer: 'rgba(239,234,223,0.5)' }
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const els = {
  width: document.getElementById('widthInput'),
  height: document.getElementById('heightInput'),
  eyebrow: document.getElementById('eyebrow'),
  headline: document.getElementById('headline'),
  subtext: document.getElementById('subtext'),
  footer: document.getElementById('footer'),
  actionPhoto: document.getElementById('actionPhoto'),
  invert: document.getElementById('invert'),
  ogLinkedinGap: document.getElementById('ogLinkedinGap'),
  safeZone: document.getElementById('safeZone'),
  formatSize: document.getElementById('formatSize'),
  download: document.getElementById('download'),
  styleButtons: Array.from(document.querySelectorAll('.style-toggle button')),
  presetSize: document.getElementById('presetSize')
};

function populateImageSelect(select, files, selected){
  select.innerHTML = files.map(f =>
    `<option value="${f}"${f === selected ? ' selected' : ''}>${f}</option>`
  ).join('');
}
populateImageSelect(els.actionPhoto, ACTION_PHOTOS, DEFAULT_ACTION_PHOTO);

let currentStyle = 'typography';
const imageCache = {};

function loadImage(src){
  if (imageCache[src]) return imageCache[src];
  imageCache[src] = new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.src = src;
  });
  return imageCache[src];
}

function drawImageCover(img, x, y, w, h){
  const scale = Math.max(w / img.width, h / img.height);
  const sw = w / scale;
  const sh = h / scale;
  const sx = (img.width - sw) / 2;
  const sy = (img.height - sh) / 2;
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function drawTracked(text, x, y, tracking){
  let cursor = x;
  for (const ch of text){
    ctx.fillText(ch, cursor, y);
    cursor += ctx.measureText(ch).width + tracking;
  }
}

// Assumes ctx.font is already set to the text's font.
function measureTrackedWidth(text, tracking){
  let total = 0;
  for (const ch of text) total += ctx.measureText(ch).width + tracking;
  return total - tracking;
}

// Assumes ctx.font is already set to the wrapping text's font.
function wrapText(text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const word of words){
    const candidate = line ? `${line} ${word}` : word;
    if (line && ctx.measureText(candidate).width > maxWidth){
      lines.push(line);
      line = word;
    } else {
      line = candidate;
    }
  }
  if (line) lines.push(line);
  return lines;
}

// Like wrapText, but flags when the text genuinely needs more lines than
// maxLines allows — used inside fitScale's search so a scale that would
// silently truncate text gets rejected as infeasible, instead of shrinking
// the measured block height and letting the scale grow past what the full
// text actually fits in.
function wrapTextCapped(text, maxWidth, maxLines){
  const lines = wrapText(text, maxWidth);
  return { lines: lines.slice(0, maxLines), overflowed: lines.length > maxLines };
}

// Binary-searches the largest `scale` for which layoutFn(scale) still fits
// within boxW x boxH, so every style's type scales up or down to
// proportionally fill whatever composition it's given — a fixed formula
// tuned for one aspect ratio (e.g. LinkedIn's 4:1) left type looking
// cramped on squarer or smaller formats (an Open Graph or Google Display
// size) instead of filling them.
function fitScale(layoutFn, boxW, boxH){
  let lo = 4, hi = Math.max(boxW, boxH) * 2, best = lo;
  for (let i = 0; i < 26; i++){
    const mid = (lo + hi) / 2;
    const { totalHeight, maxWidth } = layoutFn(mid);
    if (totalHeight <= boxH && maxWidth <= boxW){
      best = mid;
      lo = mid;
    } else {
      hi = mid;
    }
  }
  return best;
}

function drawTextBlock(padX, w, h, scheme){
  const centerY = h / 2;
  const textX = padX;
  const rightMargin = Math.max(32, w * 0.03);
  const maxTextWidth = w - textX - rightMargin;
  // Type is sized against the minimal left margin, not whichever margin is
  // actually in effect -- so turning on the LinkedIn avatar-safe margin
  // narrows the space the headline wraps into instead of shrinking the
  // type itself. See the matching comment in drawAdStyle/drawOgStyle.
  const refMaxTextWidth = w - Math.max(40, w * 0.05) - rightMargin;
  // Calibrated so the default 1584x396 LinkedIn banner renders the same
  // size as before; other aspect ratios fill proportionally from here.
  const boxH = h * 0.424;
  // Each field is optional — a blank one is skipped entirely (no gap, no
  // reserved space) so the remaining fields grow to fill the room instead
  // of leaving a hole where it used to sit.
  const hasEyebrow = els.eyebrow.value.trim().length > 0;
  const hasSubtext = els.subtext.value.trim().length > 0;
  const hasFooter = els.footer.value.trim().length > 0;
  const eyebrowText = els.eyebrow.value.toUpperCase();

  function layout(scale, wrapWidth, strict){
    const eyebrowSize = Math.round(scale * 0.045);
    const ruleThickness = Math.max(2, scale * 0.008);
    const headlineSize = Math.round(scale * 0.115);
    const headlineLineHeight = headlineSize * 1.14;
    const subSize = Math.round(scale * 0.05);
    const footSize = Math.round(scale * 0.038);

    ctx.font = `600 ${headlineSize}px Rubik`;
    let headlineLines;
    if (strict){
      const wrapped = wrapTextCapped(els.headline.value, wrapWidth, 2);
      if (wrapped.overflowed) return { totalHeight: Infinity, maxWidth: Infinity };
      headlineLines = wrapped.lines;
    } else {
      // Final render, not the scale search: never truncate, just wrap
      // onto however many lines the real available width needs.
      headlineLines = wrapText(els.headline.value, wrapWidth);
    }
    let maxWidth = 0;
    headlineLines.forEach(line => { maxWidth = Math.max(maxWidth, ctx.measureText(line).width); });

    if (hasEyebrow){
      ctx.font = `700 ${eyebrowSize}px Rubik`;
      maxWidth = Math.max(maxWidth, measureTrackedWidth(eyebrowText, 0.12 * eyebrowSize));
    }
    if (hasSubtext){
      ctx.font = `500 ${subSize}px Rubik`;
      maxWidth = Math.max(maxWidth, ctx.measureText(els.subtext.value).width);
    }
    if (hasFooter){
      ctx.font = `400 ${footSize}px Rubik`;
      maxWidth = Math.max(maxWidth, ctx.measureText(els.footer.value).width);
    }

    // Baseline-to-baseline gaps, tuned relative to scale. gapHeadlineToNext
    // is reused for headline->footer when subtext is blank.
    const gapEyebrowToHeadline = eyebrowSize * 0.9 + scale * 0.06;
    const gapHeadlineToNext = headlineSize * 0.5;
    const gapSubToFooter = subSize * 1.1;
    const headlineBlockHeight = headlineLineHeight * (headlineLines.length - 1);

    let totalHeight = (hasEyebrow ? eyebrowSize + gapEyebrowToHeadline : 0)
      + headlineSize * 0.8 + headlineBlockHeight;
    if (hasSubtext) totalHeight += gapHeadlineToNext + subSize * 0.8;
    if (hasFooter) totalHeight += (hasSubtext ? gapSubToFooter : gapHeadlineToNext) + footSize * 0.8;

    return {
      totalHeight, maxWidth,
      eyebrowSize, ruleThickness, headlineSize, headlineLineHeight, headlineLines,
      subSize, footSize, gapEyebrowToHeadline, gapHeadlineToNext, gapSubToFooter, headlineBlockHeight
    };
  }

  const scale = fitScale((s) => layout(s, refMaxTextWidth, true), refMaxTextWidth, boxH);
  const L = layout(scale, maxTextWidth, false);

  ctx.textBaseline = 'alphabetic';

  // Stack everything by baseline gaps, then centre the whole block
  // vertically — robust to which fields are present, instead of anchoring
  // the footer to the bottom edge separately.
  let cursorY = centerY - L.totalHeight / 2;

  if (hasEyebrow){
    cursorY += L.eyebrowSize * 0.8;
    ctx.font = `700 ${L.eyebrowSize}px Rubik`;
    ctx.fillStyle = scheme.eyebrow;
    drawTracked(eyebrowText, textX, cursorY, 0.12 * L.eyebrowSize);
    ctx.fillRect(textX, cursorY + L.eyebrowSize * 0.35, scale * 0.16, L.ruleThickness);
    cursorY += L.gapEyebrowToHeadline;
  }

  cursorY += L.headlineSize * 0.8;
  ctx.font = `600 ${L.headlineSize}px Rubik`;
  ctx.fillStyle = scheme.headline;
  L.headlineLines.forEach((line, i) => {
    drawTracked(line, textX, cursorY + i * L.headlineLineHeight, -0.01 * L.headlineSize);
  });
  cursorY += L.headlineBlockHeight;

  if (hasSubtext){
    cursorY += L.gapHeadlineToNext + L.subSize * 0.8;
    ctx.font = `500 ${L.subSize}px Rubik`;
    ctx.fillStyle = scheme.subtext;
    ctx.fillText(els.subtext.value, textX, cursorY);
  }

  if (hasFooter){
    cursorY += (hasSubtext ? L.gapSubToFooter : L.gapHeadlineToNext) + L.footSize * 0.8;
    ctx.font = `400 ${L.footSize}px Rubik`;
    ctx.fillStyle = scheme.footer;
    ctx.fillText(els.footer.value, textX, cursorY);
  }
}

// Yellow style — a heavy 900-weight headline and bold subtext, matching
// Tom's postcard/business card print ads rather than the site's own
// lighter web typography.
function drawAdStyle(padX, w, h, scheme){
  const centerY = h / 2;
  const textX = padX;
  const rightMargin = Math.max(32, w * 0.03);
  const maxTextWidth = w - textX - rightMargin;
  // Type is sized against the minimal left margin, not whichever margin is
  // actually in effect -- see the matching comment in drawTextBlock.
  const refMaxTextWidth = w - Math.max(40, w * 0.05) - rightMargin;
  // Calibrated so the default 1584x396 banner matches its previous size.
  const boxH = h * 0.512;
  const hasEyebrow = els.eyebrow.value.trim().length > 0;
  const hasSubtext = els.subtext.value.trim().length > 0;
  const hasFooter = els.footer.value.trim().length > 0;
  const eyebrowText = els.eyebrow.value.toUpperCase();

  function layout(scale, wrapWidth, strict){
    const eyebrowSize = Math.round(scale * 0.045);
    const headlineSize = Math.round(scale * 0.145);
    const headlineLineHeight = headlineSize * 1.05;
    const subSize = Math.round(scale * 0.055);
    const footSize = Math.round(scale * 0.04);

    ctx.font = `900 ${headlineSize}px Rubik`;
    let headlineLines;
    if (strict){
      const wrapped = wrapTextCapped(els.headline.value, wrapWidth, 2);
      if (wrapped.overflowed) return { totalHeight: Infinity, maxWidth: Infinity };
      headlineLines = wrapped.lines;
    } else {
      headlineLines = wrapText(els.headline.value, wrapWidth);
    }
    let maxWidth = 0;
    headlineLines.forEach(line => { maxWidth = Math.max(maxWidth, ctx.measureText(line).width); });

    if (hasEyebrow){
      ctx.font = `700 ${eyebrowSize}px Rubik`;
      maxWidth = Math.max(maxWidth, measureTrackedWidth(eyebrowText, 0.12 * eyebrowSize));
    }
    if (hasSubtext){
      ctx.font = `600 ${subSize}px Rubik`;
      maxWidth = Math.max(maxWidth, ctx.measureText(els.subtext.value).width);
    }
    if (hasFooter){
      ctx.font = `600 ${footSize}px Rubik`;
      maxWidth = Math.max(maxWidth, ctx.measureText(els.footer.value).width);
    }

    const gapEyebrowToHeadline = eyebrowSize * 0.9 + scale * 0.05;
    const gapHeadlineToNext = headlineSize * 0.45;
    const gapSubToFooter = subSize * 1.0;
    const headlineBlockHeight = headlineLineHeight * (headlineLines.length - 1);

    let totalHeight = (hasEyebrow ? eyebrowSize + gapEyebrowToHeadline : 0)
      + headlineSize * 0.8 + headlineBlockHeight;
    if (hasSubtext) totalHeight += gapHeadlineToNext + subSize * 0.8;
    if (hasFooter) totalHeight += (hasSubtext ? gapSubToFooter : gapHeadlineToNext) + footSize * 0.8;

    return {
      totalHeight, maxWidth,
      eyebrowSize, headlineSize, headlineLineHeight, headlineLines, subSize, footSize,
      gapEyebrowToHeadline, gapHeadlineToNext, gapSubToFooter, headlineBlockHeight
    };
  }

  const scale = fitScale((s) => layout(s, refMaxTextWidth, true), refMaxTextWidth, boxH);
  const L = layout(scale, maxTextWidth, false);

  ctx.textBaseline = 'alphabetic';
  let cursorY = centerY - L.totalHeight / 2;

  if (hasEyebrow){
    cursorY += L.eyebrowSize * 0.8;
    ctx.font = `700 ${L.eyebrowSize}px Rubik`;
    ctx.fillStyle = scheme.eyebrow;
    drawTracked(eyebrowText, textX, cursorY, 0.12 * L.eyebrowSize);
    cursorY += L.gapEyebrowToHeadline;
  }

  cursorY += L.headlineSize * 0.8;
  ctx.font = `900 ${L.headlineSize}px Rubik`;
  ctx.fillStyle = scheme.headline;
  L.headlineLines.forEach((line, i) => {
    ctx.fillText(line, textX, cursorY + i * L.headlineLineHeight);
  });
  cursorY += L.headlineBlockHeight;

  if (hasSubtext){
    cursorY += L.gapHeadlineToNext + L.subSize * 0.8;
    ctx.font = `600 ${L.subSize}px Rubik`;
    ctx.fillStyle = scheme.subtext;
    ctx.fillText(els.subtext.value, textX, cursorY);
  }

  if (hasFooter){
    cursorY += (hasSubtext ? L.gapSubToFooter : L.gapHeadlineToNext) + L.footSize * 0.8;
    ctx.font = `600 ${L.footSize}px Rubik`;
    ctx.fillStyle = scheme.footer;
    ctx.fillText(els.footer.value, textX, cursorY);
  }
}

// OG Image / link preview style — Tom's photo full-height and flush right
// on a plain field, with a short eyebrow + headline anchored top left
// (rather than centred), since link-preview crops and tiny thumbnail sizes
// make top-left the safest place to keep key text legible. The box is
// deliberately modest (well under half the height) so the type stays
// restrained and balanced rather than ballooning to fill all the space
// the photo leaves free.
function drawOgStyle(padX, w, h, img, scheme){
  const topPad = Math.max(28, h * 0.08);
  const imgW = h * (img.width / img.height);
  const imgX = w - imgW;
  const rightMargin = Math.max(24, w * 0.03);
  const maxTextWidth = imgX - padX - rightMargin;
  // Type is sized against the minimal left margin, not whichever margin is
  // actually in effect -- see the matching comment in drawTextBlock.
  const refMaxTextWidth = imgX - Math.max(40, w * 0.05) - rightMargin;
  const boxH = h * 0.5;
  const hasEyebrow = els.eyebrow.value.trim().length > 0;
  const hasSubtext = els.subtext.value.trim().length > 0;
  const hasFooter = els.footer.value.trim().length > 0;
  const eyebrowText = els.eyebrow.value.toUpperCase();

  ctx.drawImage(img, imgX, 0, imgW, h);

  function layout(scale, wrapWidth, strict){
    const eyebrowSize = Math.round(scale * 0.045);
    const headlineSize = Math.round(scale * 0.11);
    const headlineLineHeight = headlineSize * 1.1;
    const subSize = Math.round(scale * 0.05);
    const footSize = Math.round(scale * 0.038);

    ctx.font = `900 ${headlineSize}px Rubik`;
    let headlineLines;
    if (strict){
      const wrapped = wrapTextCapped(els.headline.value, wrapWidth, 3);
      if (wrapped.overflowed) return { totalHeight: Infinity, maxWidth: Infinity };
      headlineLines = wrapped.lines;
    } else {
      headlineLines = wrapText(els.headline.value, wrapWidth);
    }
    let maxWidth = 0;
    headlineLines.forEach(line => { maxWidth = Math.max(maxWidth, ctx.measureText(line).width); });

    if (hasEyebrow){
      ctx.font = `700 ${eyebrowSize}px Rubik`;
      maxWidth = Math.max(maxWidth, measureTrackedWidth(eyebrowText, 0.12 * eyebrowSize));
    }
    if (hasSubtext){
      ctx.font = `500 ${subSize}px Rubik`;
      maxWidth = Math.max(maxWidth, ctx.measureText(els.subtext.value).width);
    }
    if (hasFooter){
      ctx.font = `400 ${footSize}px Rubik`;
      maxWidth = Math.max(maxWidth, ctx.measureText(els.footer.value).width);
    }

    const gapEyebrowToHeadline = eyebrowSize * 0.9 + scale * 0.05;
    const gapHeadlineToNext = headlineSize * 0.45;
    const gapSubToFooter = subSize * 1.0;
    const headlineBlockHeight = headlineLineHeight * (headlineLines.length - 1);

    let totalHeight = (hasEyebrow ? eyebrowSize + gapEyebrowToHeadline : 0)
      + headlineSize * 0.8 + headlineBlockHeight;
    if (hasSubtext) totalHeight += gapHeadlineToNext + subSize * 0.8;
    if (hasFooter) totalHeight += (hasSubtext ? gapSubToFooter : gapHeadlineToNext) + footSize * 0.8;

    return {
      totalHeight, maxWidth,
      eyebrowSize, headlineSize, headlineLineHeight, headlineLines, subSize, footSize,
      gapEyebrowToHeadline, gapHeadlineToNext, gapSubToFooter, headlineBlockHeight
    };
  }

  const scale = fitScale((s) => layout(s, refMaxTextWidth, true), refMaxTextWidth, boxH);
  const L = layout(scale, maxTextWidth, false);

  ctx.textBaseline = 'alphabetic';
  let cursorY = topPad;

  if (hasEyebrow){
    cursorY += L.eyebrowSize * 0.8;
    ctx.font = `700 ${L.eyebrowSize}px Rubik`;
    ctx.fillStyle = scheme.eyebrow;
    drawTracked(eyebrowText, padX, cursorY, 0.12 * L.eyebrowSize);
    cursorY += L.gapEyebrowToHeadline;
  }

  cursorY += L.headlineSize * 0.8;
  ctx.font = `900 ${L.headlineSize}px Rubik`;
  ctx.fillStyle = scheme.headline;
  L.headlineLines.forEach((line, i) => {
    ctx.fillText(line, padX, cursorY + i * L.headlineLineHeight);
  });
  cursorY += L.headlineBlockHeight;

  if (hasSubtext){
    cursorY += L.gapHeadlineToNext + L.subSize * 0.8;
    ctx.font = `500 ${L.subSize}px Rubik`;
    ctx.fillStyle = scheme.subtext;
    ctx.fillText(els.subtext.value, padX, cursorY);
  }

  if (hasFooter){
    cursorY += (hasSubtext ? L.gapSubToFooter : L.gapHeadlineToNext) + L.footSize * 0.8;
    ctx.font = `400 ${L.footSize}px Rubik`;
    ctx.fillStyle = scheme.footer;
    ctx.fillText(els.footer.value, padX, cursorY);
  }
}

// Guards against overlapping calls: draw() awaits font/image loads, so a
// fast style/dimension change can let an older call resume after a newer
// one already resized the canvas, painting stale content over it.
let drawGeneration = 0;

async function draw(){
  const myGeneration = ++drawGeneration;
  const w = Math.max(200, parseInt(els.width.value, 10) || 1584);
  const h = Math.max(50, parseInt(els.height.value, 10) || 396);
  els.formatSize.textContent = `${w} × ${h} px`;

  canvas.width = w;
  canvas.height = h;

  await document.fonts.load(`700 20px Rubik`);
  await document.fonts.load(`600 60px Rubik`);
  await document.fonts.load(`400 24px Rubik`);
  await document.fonts.load(`900 60px Rubik`);
  await document.fonts.ready;
  if (myGeneration !== drawGeneration) return;

  // Capped relative to width so narrow presets (Google Display ads, the
  // LinkedIn company banner) don't push text off-canvas entirely — at the
  // default 1584px LinkedIn width this cap has no effect.
  const avatarSafePadX = Math.min(Math.max(64, SAFE_ZONE.w + 40), w * 0.25);
  // A general "make this work as a LinkedIn cover" setting, not tied to
  // any one style — LinkedIn's circular profile photo overlaps the left
  // edge of every cover/banner slot on a personal profile, whichever
  // style you're exporting it in. Unchecked, use a normal, minimal
  // margin instead.
  const padX = els.ogLinkedinGap.checked ? avatarSafePadX : Math.max(40, w * 0.05);

  ctx.clearRect(0, 0, w, h);

  if (currentStyle === 'photography'){
    const photoSrc = ACTION_DIR + els.actionPhoto.value;
    const img = await loadImage(photoSrc);
    if (myGeneration !== drawGeneration) return;
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, w, h);
    ctx.filter = 'saturate(0.85) contrast(1.05)';
    drawImageCover(img, 0, 0, w, h);
    ctx.filter = 'none';

    // Ink wash over the whole frame so the photo reads as branded rather
    // than raw, then a diagonal dark gradient — same treatment as the
    // site's full-width photo banners — for the heading to sit on.
    ctx.fillStyle = 'rgba(0,38,42,0.35)';
    ctx.fillRect(0, 0, w, h);
    const grad = ctx.createLinearGradient(0, 0, w * 0.62, h);
    grad.addColorStop(0, 'rgba(0,38,42,0.97)');
    grad.addColorStop(0.5, 'rgba(0,38,42,0.88)');
    grad.addColorStop(0.8, 'rgba(0,38,42,0.25)');
    grad.addColorStop(1, 'rgba(0,38,42,0.1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    drawTextBlock(padX, w, h, SCHEMES.dark);
  } else if (currentStyle === 'yellow'){
    const scheme = els.invert.checked ? AD_SCHEMES.inverted : AD_SCHEMES.normal;
    ctx.fillStyle = scheme.bg;
    ctx.fillRect(0, 0, w, h);
    drawAdStyle(padX, w, h, scheme);
  } else if (currentStyle === 'social'){
    const scheme = els.invert.checked ? OG_SCHEMES.inverted : OG_SCHEMES.normal;
    ctx.fillStyle = scheme.bg;
    ctx.fillRect(0, 0, w, h);
    const img = await loadImage(OG_PORTRAIT_SRC);
    if (myGeneration !== drawGeneration) return;
    drawOgStyle(padX, w, h, img, scheme);
  } else {
    // Photography keeps its dark ink wash regardless of the invert
    // checkbox — a light overlay wouldn't leave the text legible against
    // an arbitrary photo, so there's no safe "inverted" version of it.
    const scheme = els.invert.checked ? SCHEMES.light : SCHEMES.dark;
    ctx.fillStyle = els.invert.checked ? CREAM : INK;
    ctx.fillRect(0, 0, w, h);
    drawTextBlock(padX, w, h, scheme);
  }

  if (els.safeZone.checked && currentStyle !== 'social'){
    const isLightBg = currentStyle === 'yellow'
      ? !els.invert.checked
      : currentStyle === 'typography' && els.invert.checked;
    const guideColor = isLightBg ? '0,38,42' : '255,255,255';
    ctx.save();
    ctx.strokeStyle = `rgba(${guideColor},0.55)`;
    ctx.setLineDash([8, 6]);
    ctx.lineWidth = 2;
    ctx.strokeRect(SAFE_ZONE.x + 6, SAFE_ZONE.y + 6, SAFE_ZONE.w - 12, SAFE_ZONE.h - 12);
    ctx.font = `500 ${Math.round(h * 0.035)}px Rubik`;
    ctx.fillStyle = `rgba(${guideColor},0.7)`;
    ctx.setLineDash([]);
    ctx.fillText('profile photo overlap', 16, SAFE_ZONE.h + 28);
    ctx.restore();
  }
}

function setStyle(style){
  currentStyle = style;
  els.styleButtons.forEach(btn => btn.setAttribute('aria-pressed', String(btn.dataset.style === style)));
  draw();
}

function download(){
  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tom-the-chiropractor-${canvas.width}x${canvas.height}-${currentStyle}-banner.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }, 'image/png');
}

[els.width, els.height, els.eyebrow, els.headline, els.subtext, els.footer, els.actionPhoto, els.invert, els.ogLinkedinGap, els.safeZone].forEach(el => {
  el.addEventListener('input', draw);
});
els.styleButtons.forEach(btn => btn.addEventListener('click', () => setStyle(btn.dataset.style)));
els.presetSize.addEventListener('change', () => {
  const [w, h] = els.presetSize.value.split(',');
  els.width.value = w;
  els.height.value = h;
  draw();
});
els.download.addEventListener('click', download);

setStyle(currentStyle);
</script>
</body>
</html>
